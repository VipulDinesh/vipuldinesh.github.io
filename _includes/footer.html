<footer class="site-footer">
    <div class="container">
        <div class="footer-simple">
            <div class="footer-brand">
                <div class="mesgro-title">Vipul Dinesh</div>
                <div class="mesgro-definition">
                    Robotics · Mechatronics · Systems Integration
                </div>
            </div>

            <div class="social-links-center">
                {% if site.github_username %}
                <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener" aria-label="GitHub">
                    <i class="fab fa-github"></i>
                </a>
                {% endif %}
                {% if site.linkedin_username %}
                <a href="https://linkedin.com/in/{{ site.linkedin_username }}" target="_blank" rel="noopener" aria-label="LinkedIn">
                    <i class="fab fa-linkedin"></i>
                </a>
                {% endif %}
                {% if site.resume_url %}
                <a href="{{ site.resume_url | relative_url }}" target="_blank" rel="noopener" aria-label="Résumé">
                    <i class="fas fa-file-alt"></i>
                </a>
                {% endif %}
                {% if site.email %}
                <a href="mailto:{{ site.email }}" aria-label="Email">
                    <i class="fas fa-envelope"></i>
                </a>
                {% endif %}
            </div>

            <div class="footer-credits">
                <p>&copy; {{ 'now' | date: '%Y' }} {{ site.author | default: site.title }}.</p>
            </div>
        </div>
    </div>
</footer>
