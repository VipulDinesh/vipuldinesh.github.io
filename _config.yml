# Site settings
title: "Vipul Dinesh | Robotics & Mechatronics"
description: "Robotics hardware, mechanical design, embedded control, and systems-integration projects by Vipul Dinesh, a final-year Mechatronics Engineering student at Manipal Institute of Technology."
url: "https://vipuldinesh.github.io"
baseurl: ""
author: "Vipul Dinesh"
email: "vipuldinesh11@gmail.com"
github_username: "VipulDinesh"
linkedin_username: "vipul-dinesh"
twitter_username: ""

# Build settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Collections
collections:
  projects:
    output: true
    permalink: /:collection/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - LICENSE

# Site navigation
navigation:
  - title: "Home"
    url: "/"
  - title: "Projects"
    url: "/projects/"
  - title: "About"
    url: "/about/"

# Project categories
project_categories:
  - name: "Robotics"
    slug: "robotics"
    description: "Autonomous robots and robotic systems"
  - name: "Mechanical Design"
    slug: "mechanical-design"
    description: "Mechanisms, CAD, FEA, and mechanical integration"
  - name: "Systems Integration"
    slug: "systems-integration"
    description: "Complete electromechanical systems and validation"
  - name: "Embedded"
    slug: "embedded"
    description: "Embedded firmware, actuation, and sensing"
  - name: "ROS 2"
    slug: "ros-2"
    description: "Robot software, descriptions, and control packages"
  - name: "Simulation"
    slug: "simulation"
    description: "Gazebo environments and simulated robot systems"
  - name: "Precision Engineering"
    slug: "precision-engineering"
    description: "High-accuracy mechanisms and qualification testing"

# 3D Model settings
models:
  supported_formats: ["stl", "obj", "gltf", "glb"]
  default_background: "#f0f0f0"
  camera_controls: true
  auto_rotate: false

# Schema settings
schematics:
  supported_formats: ["png", "jpg", "jpeg", "svg", "pdf"]
  zoom_enabled: true
  pan_enabled: true
