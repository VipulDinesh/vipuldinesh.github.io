# Site settings
title: "Vipul Dinesh | Robotics & Mechatronics"
description: "Robotics, simulation, control, and human-machine interface projects by Vipul Dinesh, a Mechatronics Engineering student at Manipal Institute of Technology."
url: "https://vipuldinesh.github.io"
baseurl: ""
author: "Vipul Dinesh"
email: "portfolio.7ggfx@passinbox.com"
github_username: "VipulDinesh"
linkedin_username: "vipul-dinesh"
twitter_username: ""

# Build settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Collections
collections:
  projects:
    output: true
    permalink: /:collection/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - LICENSE

# Site navigation
navigation:
  - title: "Home"
    url: "/"
  - title: "Projects"
    url: "/projects/"
  - title: "About"
    url: "/about/"

# Project categories
project_categories:
  - name: "Robotics"
    slug: "robotics"
    description: "Autonomous robots and robotic systems"
  - name: "ROS 2"
    slug: "ros-2"
    description: "Robot software, descriptions, and control packages"
  - name: "Simulation"
    slug: "simulation"
    description: "Gazebo environments and simulated robot systems"
  - name: "Interfaces"
    slug: "interfaces"
    description: "Operator tools and human-machine interfaces"
  - name: "Python"
    slug: "python"
    description: "Python robotics, control, and interface software"

# 3D Model settings
models:
  supported_formats: ["stl", "obj", "gltf", "glb"]
  default_background: "#f0f0f0"
  camera_controls: true
  auto_rotate: false

# Schema settings
schematics:
  supported_formats: ["png", "jpg", "jpeg", "svg", "pdf"]
  zoom_enabled: true
  pan_enabled: true
