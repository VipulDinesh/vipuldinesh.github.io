# Site settings
title: "Vipul Dinesh | Robotics & Mechatronics"
description: "Robotics hardware, mechanical design, embedded control, and systems-integration projects by Vipul Dinesh, a final-year Mechatronics Engineering student at Manipal Institute of Technology."
url: "https://vipuldinesh.github.io"
baseurl: ""
author: "Vipul Dinesh"
email: "vipuldinesh11@gmail.com"
github_username: "VipulDinesh"
linkedin_username: "vipul-dinesh"
twitter_username: ""

# Build settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Collections
collections:
  projects:
    output: true
    permalink: /:collection/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - LICENSE

# Site navigation
navigation:
  - title: "Home"
    url: "/"
  - title: "Projects"
    url: "/projects/"
  - title: "About"
    url: "/about/"

# Project categories
project_categories:
  - name: "Robotics"
    slug: "robotics"
    description: "Robotic platforms, locomotion, manipulation, and autonomous behavior"
  - name: "Mechanical Systems"
    slug: "mechanical-systems"
    description: "Mechanisms, structures, transmissions, and actuation design"
  - name: "Embedded & Control"
    slug: "embedded-control"
    description: "Embedded firmware, sensing, motor control, and control systems"
  - name: "Robot Software & Simulation"
    slug: "robot-software-simulation"
    description: "ROS 2, robot models, simulation, and operator software"
  - name: "Systems Integration"
    slug: "systems-integration"
    description: "Cross-disciplinary electromechanical integration and deployment"
  - name: "Precision & Validation"
    slug: "precision-validation"
    description: "High-accuracy systems, characterization, and qualification testing"

# 3D Model settings
models:
  supported_formats: ["stl", "obj", "gltf", "glb"]
  default_background: "#f0f0f0"
  camera_controls: true
  auto_rotate: false

# Schema settings
schematics:
  supported_formats: ["png", "jpg", "jpeg", "svg", "pdf"]
  zoom_enabled: true
  pan_enabled: true
